services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluent-php
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fluent
      DB_USER: fluent
      DB_PASSWORD: fluent
    networks:
      - fluent

  nginx:
    image: nginx:alpine
    container_name: fluent-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - fluent

  postgres:
    image: postgres:16-alpine
    container_name: fluent-postgres
    environment:
      POSTGRES_DB: fluent
      POSTGRES_USER: fluent
      POSTGRES_PASSWORD: fluent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - fluent

volumes:
  postgres_data:

networks:
  fluent: